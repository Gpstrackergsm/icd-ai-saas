name: UAE Audit Certification (MANDATORY GATE)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  uae-certification:
    name: UAE Certification Suite (100/100 Required)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run UAE Audit Certification Suite
      run: npm run test:uae-cert
      
    - name: Hard Gate - Block on Failure
      if: failure()
      run: |
        echo "╔═══════════════════════════════════════════════════════════════╗"
        echo "║ ❌ UAE CERTIFICATION FAILED                                    ║"
        echo "║ MERGE BLOCKED - DEPLOYMENT BLOCKED                             ║"
        echo "║ Fix all failures before proceeding                             ║"
        echo "╚═══════════════════════════════════════════════════════════════╝"
        exit 1
        
    - name: Success Confirmation
      if: success()
      run: |
        echo "╔═══════════════════════════════════════════════════════════════╗"
        echo "║ ✅ UAE CERTIFICATION PASSED (100/100)                          ║"
        echo "║ MERGE ALLOWED - DEPLOYMENT ALLOWED                             ║"
        echo "╚═══════════════════════════════════════════════════════════════╝"
